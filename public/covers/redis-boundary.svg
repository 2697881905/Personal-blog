<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Redis 的边界</title>
  <desc id="desc">石墨黑背景上由键值、TTL 倒计时、数据库与缓存层组成的 Redis 边界示意</desc>
  <rect width="1600" height="900" fill="#141618"/>
  <path d="M64 112H1536M64 788H1536" stroke="#3b3a35"/>
  <text x="84" y="86" fill="#8a8978" font-family="Arial, sans-serif" font-size="20" letter-spacing="5">CACHE NOTES / 05</text>
  <text x="1516" y="86" text-anchor="end" fill="#8a8978" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">REDIS / TTL</text>

  <text x="96" y="300" fill="#ff8709" font-family="Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-4">REDIS</text>
  <text x="100" y="404" fill="#9d95ff" font-family="Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">BOUNDARY</text>
  <text x="104" y="472" fill="#b9b7a6" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" letter-spacing="5">缓存之外，还有边界</text>
  <path d="M100 522h560" stroke="#3b3a35" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="18" letter-spacing="2" fill="#66655b">
    <text x="100" y="574">CACHE</text>
    <text x="238" y="574">STATE</text>
    <text x="384" y="574">COORDINATION</text>
  </g>
  <g fill="none" stroke-width="2">
    <rect x="100" y="606" width="72" height="18" stroke="#ff8709"/>
    <rect x="238" y="606" width="72" height="18" stroke="#5f5e55"/>
    <rect x="384" y="606" width="112" height="18" stroke="#5f5e55"/>
    <path d="M172 615h66m-14-14 14 14-14 14M310 615h74m-14-14 14 14-14 14" stroke="#ff8709"/>
  </g>

  <g transform="translate(846 176)">
    <rect width="572" height="520" rx="24" fill="none" stroke="#5c5b52" stroke-width="2"/>
    <text x="32" y="48" fill="#8a8978" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">CACHE LAYER</text>
    <path d="M32 70h508" stroke="#3b3a35" stroke-width="2"/>

    <rect x="32" y="98" width="242" height="330" fill="none" stroke="#ff8709" stroke-width="2"/>
    <text x="54" y="134" fill="#ff8709" font-family="Arial, sans-serif" font-size="17" letter-spacing="3">REDIS</text>
    <text x="54" y="176" fill="#8a8978" font-family="Arial, sans-serif" font-size="14">sms:code:{mobile}</text>
    <text x="54" y="206" fill="#8a8978" font-family="Arial, sans-serif" font-size="14">sms:limit:phone:</text>
    <text x="54" y="236" fill="#8a8978" font-family="Arial, sans-serif" font-size="14">result:{id}:v{n}</text>
    <path d="M54 262h196" stroke="#3b3a35"/>
    <text x="54" y="304" fill="#ff8709" font-family="Arial, sans-serif" font-size="42" font-weight="700">05:00</text>
    <text x="54" y="334" fill="#66655b" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">TTL / ONE-TIME</text>

    <path d="M298 264h40m-14-14 14 14-14 14" fill="none" stroke="#ff8709" stroke-width="3"/>
    <path d="M338 198v132M338 198l-14 14M338 198l14 14M338 330l-14-14M338 330l14-14" fill="none" stroke="#3b3a35" stroke-width="2"/>

    <g transform="translate(338 98)">
      <rect x="0" y="0" width="202" height="330" fill="none" stroke="#5f5e55" stroke-width="2"/>
      <path d="M0 52h202" stroke="#3b3a35"/>
      <text x="20" y="34" fill="#8a8978" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">MYSQL</text>
      <path d="M24 128c0-22 154-22 154 0v118c0 22-154 22-154 0z" fill="none" stroke="#8a8978" stroke-width="2"/>
      <path d="M24 128c0 18 154 18 154 0M24 166c0 18 154 18 154 0M24 204c0 18 154 18 154 0" fill="none" stroke="#4a4a43" stroke-width="2"/>
      <text x="36" y="286" fill="#66655b" font-family="Arial, sans-serif" font-size="13">SOURCE OF TRUTH</text>
    </g>

    <text x="32" y="474" fill="#b9b7a6" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" letter-spacing="2">先定义旧值能存在多久</text>
  </g>

  <text x="84" y="838" fill="#66655b" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">TTL / ATOMIC / DEGRADE</text>
  <text x="1516" y="838" text-anchor="end" fill="#ff8709" font-family="Arial, sans-serif" font-size="22">SET NX / LUA</text>
</svg>
