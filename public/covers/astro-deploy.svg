<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Astro 静态站点部署</title>
  <desc id="desc">石墨黑背景上的构建、dist、Nginx、缓存分层与发布目录示意</desc>
  <rect width="1600" height="900" fill="#141618"/>
  <path d="M64 112H1536M64 788H1536" stroke="#3b3a35"/>
  <text x="84" y="86" fill="#8a8978" font-family="Arial, sans-serif" font-size="20" letter-spacing="5">DEPLOY NOTES / 06</text>
  <text x="1516" y="86" text-anchor="end" fill="#8a8978" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">ASTRO / NGINX</text>

  <text x="96" y="300" fill="#ff8709" font-family="Arial, sans-serif" font-size="108" font-weight="700" letter-spacing="-4">STATIC</text>
  <text x="100" y="404" fill="#9d95ff" font-family="Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">DELIVERY</text>
  <text x="104" y="472" fill="#b9b7a6" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" letter-spacing="5">静态，不等于随手一传</text>
  <path d="M100 522h560" stroke="#3b3a35" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="18" letter-spacing="2" fill="#66655b">
    <text x="100" y="574">BUILD</text>
    <text x="238" y="574">CACHE</text>
    <text x="384" y="574">RELEASE</text>
  </g>
  <g fill="none" stroke-width="2">
    <rect x="100" y="606" width="72" height="18" stroke="#ff8709"/>
    <rect x="238" y="606" width="72" height="18" stroke="#5f5e55"/>
    <rect x="384" y="606" width="112" height="18" stroke="#5f5e55"/>
    <path d="M172 615h66m-14-14 14 14-14 14M310 615h74m-14-14 14 14-14 14" stroke="#ff8709"/>
  </g>

  <g transform="translate(846 176)">
    <rect width="572" height="520" rx="24" fill="none" stroke="#5c5b52" stroke-width="2"/>
    <text x="32" y="48" fill="#8a8978" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">BUILD → DIST → EDGE</text>
    <path d="M32 70h508" stroke="#3b3a35" stroke-width="2"/>

    <g fill="none" stroke="#5f5e55" stroke-width="2">
      <rect x="32" y="102" width="136" height="84"/>
      <rect x="218" y="102" width="136" height="84"/>
      <rect x="404" y="102" width="136" height="84"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" letter-spacing="2">
      <text x="100" y="138" fill="#ff8709">BUILD</text>
      <text x="286" y="138" fill="#8a8978">DIST</text>
      <text x="472" y="138" fill="#8a8978">NGINX</text>
      <text x="100" y="162" fill="#66655b" font-size="11">npm run build</text>
      <text x="286" y="162" fill="#66655b" font-size="11">_astro hashed</text>
      <text x="472" y="162" fill="#66655b" font-size="11">try_files</text>
    </g>
    <g fill="none" stroke="#ff8709" stroke-width="3">
      <path d="M168 144h40m-12-12 12 12-12 12M354 144h40m-12-12 12 12-12 12"/>
    </g>

    <g font-family="Arial, sans-serif" font-size="14" letter-spacing="1">
      <text x="32" y="238" fill="#66655b">CACHE LAYERS</text>
      <rect x="32" y="258" width="150" height="34" fill="none" stroke="#5f5e55"/>
      <text x="46" y="280" fill="#b9b7a6">HTML / no-cache</text>
      <rect x="200" y="258" width="166" height="34" fill="none" stroke="#ff8709"/>
      <text x="214" y="280" fill="#ff8709">_astro / immutable</text>
      <rect x="384" y="258" width="148" height="34" fill="none" stroke="#5f5e55"/>
      <text x="398" y="280" fill="#b9b7a6">covers / 7d</text>
    </g>

    <path d="M32 326h508" stroke="#3b3a35" stroke-width="2"/>
    <text x="32" y="360" fill="#66655b" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">RELEASES</text>
    <g font-family="Arial, sans-serif" font-size="14">
      <text x="46" y="392" fill="#8a8978">releases/</text>
      <text x="66" y="420" fill="#8a8978">1a2b3c4/</text>
      <text x="66" y="448" fill="#ff8709">5d6e7f8/  ← new</text>
      <text x="46" y="486" fill="#8a8978">current → releases/</text>
      <text x="46" y="510" fill="#66655b" font-size="12">switch symlink, then reload</text>
    </g>
    <g fill="none" stroke="#ff8709" stroke-width="3">
      <path d="M46 392v50h14m-12-12 12 12-12 12"/>
    </g>

  </g>

  <text x="84" y="838" fill="#66655b" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">IMMUTABLE ASSETS / ATOMIC RELEASE</text>
  <text x="1516" y="838" text-anchor="end" fill="#ff8709" font-family="Arial, sans-serif" font-size="22">DIST → WEB</text>
</svg>
